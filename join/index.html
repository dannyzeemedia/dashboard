<title>Set up your Zee.Media dashboard</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0815;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 520px at 12% -10%,rgba(70,97,242,.30),transparent 60%),radial-gradient(950px 620px at 100% 0%,rgba(121,0,255,.32),transparent 55%),radial-gradient(760px 520px at 88% 115%,rgba(255,0,227,.16),transparent 60%),#0b0815}
  #login[hidden]{display:none}
  [hidden]{display:none!important}
  .lform{position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:34px 32px 24px;
    width:392px;max-width:100%;box-shadow:0 40px 90px -30px rgba(121,0,255,.55),inset 0 1px 0 rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .lform::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#4661f2,#7900ff 55%,#ff00e3)}
  .llogo{height:44px;width:auto;margin:6px 0 2px;filter:drop-shadow(0 2px 12px rgba(56,182,255,.28))}
  .leyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:10.5px;font-weight:800;color:#38b6ff;margin-top:2px}
  .lsub{color:rgba(255,255,255,.62);font-size:13px;margin-top:-4px}
  .lfoot{margin-top:4px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);text-align:center;
    color:rgba(255,255,255,.5);font-size:12px;letter-spacing:.01em}
  .lform label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.5)}
  .lform input{font:inherit;font-size:15px;padding:11px 12px;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;background:rgba(255,255,255,.05);color:#fff}
  .lform input:focus{outline:2px solid #7900ff;border-color:#7900ff}
  .lform button{margin-top:6px;font:inherit;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#4661f2,#7900ff);
    border:0;border-radius:10px;padding:13px;cursor:pointer;box-shadow:0 12px 28px -10px rgba(121,0,255,.75)}
  .lform button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
  .lform button:disabled{opacity:.6}
  .lerr{color:#ff8b8b;font-size:13px}
  .lform{gap:14px;display:flex;flex-direction:column}
  .jclient{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:2px 0 -2px;line-height:1.3}
  .jalt{margin-top:2px;text-align:center;font-size:13px;color:rgba(255,255,255,.62)}
  .jalt button{all:unset;color:#38b6ff;font-weight:700;cursor:pointer}
  .jalt button:hover{text-decoration:underline}
  .jok{color:#6ee7a8;font-size:13px}
  .jhint{color:rgba(255,255,255,.45);font-size:12px;margin-top:7px;line-height:1.45}
  .jlogos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:2px}
  .jlogos img.cl{height:30px;width:auto;border-radius:6px;background:#fff;padding:5px 8px}
  .jlogos{flex-wrap:wrap}
  #clogo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
</style>

<script>
const SB_URL='https://dxocfmwjwzzseepujfji.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4b2NmbXdqd3p6c2VlcHVqZmppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMDYxODEsImV4cCI6MjEwMDc4MjE4MX0.id5f4bAwWHSYmIumwvSQ0X1g7R6PqUH-HnGs_5SKFq4';
const sb=window.supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const TOKEN=qs.get('t')||'';
let SLUG='', NAME='', MODE='signup';
const show=(el,on)=>{el.hidden=!on;};
function err(m){$('jerr').textContent=m;show($('jerr'),!!m);if(m)show($('jmsg'),false);}
function ok(m){$('jmsg').textContent=m;show($('jmsg'),!!m);if(m)err('');}

// A recovery link from the password-reset email lands here with a session
// already attached, so the only thing to ask for is the new password.
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
const RECOVERY=hash.get('type')==='recovery';

function setMode(m){
  MODE=m;
  $('jbtn').textContent = m==='signup' ? 'Create my access' : 'Sign in';
  $('jpass').setAttribute('autocomplete', m==='signup'?'new-password':'current-password');
  $('jaltq').textContent = m==='signup' ? 'Already set up?' : 'First time here?';
  $('jtoggle').textContent = m==='signup' ? 'Sign in' : 'Create access';
  show($('jforgotwrap'), m==='signin');
  $('jhint').textContent = m==='signup'
    ? 'At least 8 characters. You choose it, we never see it.'
    : 'Use the password you chose.';
  err('');
}

async function boot(){
  if(RECOVERY){
    $('jclient').textContent='Choose a new password';
    $('jsub').textContent='Enter a new password for your account.';
    show($('jfields'),true); show($('jbtn'),true);
    $('jemail').closest('label').hidden=true;
    $('jbtn').textContent='Save new password';
    MODE='recover';
    return;
  }
  if(!TOKEN){
    $('jclient').textContent='This link is missing its code';
    $('jsub').textContent='Ask your account manager to resend it.';
    return;
  }
  const {data,error}=await sb.rpc('peek_invite',{p_token:TOKEN});
  const rows=(data&&data.length)?data:null;
  if(error||!rows){
    $('jclient').textContent='This link is no longer valid';
    $('jsub').textContent='Ask your account manager for a new one.';
    return;
  }
  // one link can cover several brands under the same owner
  SLUG=rows[0].client_slug;
  const names=rows.map(r=>r.client_name||r.client_slug);
  NAME=names.length>1
    ? names.slice(0,-1).join(', ')+' and '+names[names.length-1]
    : names[0];
  $('jclient').textContent=NAME;
  $('jsub').textContent=rows.length>1
    ? 'Set up your access to all '+rows.length+' dashboards.'
    : 'Set up your access to the reporting dashboard.';
  rows.slice(0,3).forEach(r=>{
    const img=new Image();
    img.className='cl'; img.alt=r.client_name||r.client_slug;
    img.onload=()=>$('clogo').appendChild(img);
    img.src='../logos/'+r.client_slug+'.png';
  });
  show($('jfields'),true); show($('jbtn'),true); show($('jalt'),true);
  setMode('signup');
  // already signed in on this device: just take the access and go
  const {data:s}=await sb.auth.getSession();
  if(s&&s.session){
    ok('Signed in already, opening your dashboard…');
    await grant();
  }
}

async function grant(){
  const {data,error}=await sb.rpc('redeem_invite',{p_token:TOKEN});
  if(error){err(error.message||'Could not complete your access.');return;}
  location.href='../'+(data||SLUG)+'/';
}

$('jtoggle').addEventListener('click',()=>setMode(MODE==='signup'?'signin':'signup'));

$('jforgot').addEventListener('click',async()=>{
  const email=$('jemail').value.trim();
  if(!email){err('Enter your email first, then press Forgot password.');return;}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});
  if(error){err(error.message);return;}
  ok('Check your email for a link to set a new password.');
});

$('jform').addEventListener('submit',async e=>{
  e.preventDefault(); err('');
  const btn=$('jbtn'); btn.disabled=true;
  const email=$('jemail').value.trim(), pass=$('jpass').value;
  try{
    if(MODE==='recover'){
      const {error}=await sb.auth.updateUser({password:pass});
      if(error)throw error;
      ok('Password saved. Opening your dashboard…');
      const {data:s}=await sb.auth.getSession();
      const uid=s&&s.session&&s.session.user&&s.session.user.id;
      const {data:acc}=await sb.from('report_access').select('client_slug').limit(1);
      location.href='../'+((acc&&acc[0]&&acc[0].client_slug)||'')+'/';
      return;
    }
    if(MODE==='signup'){
      const {data,error}=await sb.auth.signUp({email:email,password:pass});
      if(error)throw error;
      const u=data&&data.user;
      if(u&&u.identities&&u.identities.length===0){
        setMode('signin');
        err('That email already has a login. Enter your password to sign in, or use Forgot password.');
        btn.disabled=false; return;
      }
      if(!(data&&data.session)){
        const r=await sb.auth.signInWithPassword({email:email,password:pass});
        if(r.error)throw r.error;
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email:email,password:pass});
      if(error)throw error;
    }
    ok('Setting up your dashboard…');
    await grant();
  }catch(ex){
    err((ex&&ex.message)||'Something went wrong. Try again.');
  }finally{ btn.disabled=false; }
});

boot();
</script>
</body>
</html>
